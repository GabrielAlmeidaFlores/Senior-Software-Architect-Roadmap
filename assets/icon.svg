<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc">
  <title id="title">Senior Software Architect Roadmap</title>
  <desc id="desc">A rounded gradient tile containing an ascending network graph, representing an architecture learning roadmap.</desc>

  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A66C2"/>
      <stop offset="0.52" stop-color="#5B4BDB"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#tile)"/>

  <g opacity="0.14" fill="#FFFFFF">
    <circle cx="86" cy="86" r="5"/>
    <circle cx="150" cy="86" r="5"/>
    <circle cx="214" cy="86" r="5"/>
    <circle cx="426" cy="426" r="5"/>
    <circle cx="362" cy="426" r="5"/>
    <circle cx="298" cy="426" r="5"/>
  </g>

  <path d="M150 356 L242 288 L330 218 L396 150"
        fill="none" stroke="url(#edge)" stroke-width="18"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M330 218 L222 172"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="14"
        stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="396" cy="150" r="56" fill="url(#glow)" filter="url(#soft)"/>

  <g stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="8">
    <circle cx="150" cy="356" r="26" fill="#0A66C2"/>
    <circle cx="242" cy="288" r="26" fill="#3B5BD9"/>
    <circle cx="330" cy="218" r="26" fill="#6D4EE0"/>
    <circle cx="222" cy="172" r="18" fill="#8B5CF6" fill-opacity="0.9"/>
  </g>

  <circle cx="396" cy="150" r="34" fill="#FFFFFF"/>
  <path d="M381 150 l10 12 l20 -24" fill="none" stroke="#5B4BDB" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
